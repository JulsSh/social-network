# Резолвер Docker DNS
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name frontend;
    proxy_read_timeout 1d;

    # Статические файлы Vue приложения
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket для диалогов — напрямую в dialog-service, минуя gateway
    location /api/v1/streaming/ {
        set $upstream_dialog http://213.217.1.240:8089;
        proxy_pass $upstream_dialog;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # Проксирование API запросов
    location /api/ {
        # Используем переменную для динамического резолва
        # Nginx не упадёт, если хост недоступен при старте
        # Порт 8084 - порт Spring Cloud Gateway
        set $upstream_api http://213.217.1.240:8084;

        # Обработка preflight CORS запросов
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }


        proxy_pass $upstream_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS заголовки для ответов
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Обработка ошибок - вернуть 502 если gateway недоступен
        proxy_intercept_errors on;
        error_page 502 503 504 @api_unavailable;

        #image upload size for MC POST
        client_max_body_size 50M;

    }

    # Fallback если API недоступен
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error": "API Gateway is temporarily unavailable", "status": 503}';
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

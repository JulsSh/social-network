server:
  port: ${SERVER_PORT:8765}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/api/v1/auth/**
            - id: dialog
              uri: lb://dialog
              predicates:
                - Path=/api/v1/dialogs,/api/v1/dialogs/**

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Application
spring.application.name=dialog
server.port=8089

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dialog_db}
spring.datasource.username=${DB_USER:dialoguser}
spring.datasource.password=${DB_PASSWORD:dialogpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.liquibase=DEBUG
logging.level.org.springframework.security=DEBUG

# Auth mc service settings
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8090}

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=dialog
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

#Actuator
management.endpoints.web.exposure.include=health

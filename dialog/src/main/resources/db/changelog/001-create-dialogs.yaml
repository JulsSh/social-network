databaseChangeLog:
  - changeSet:
      id: 001-create-dialogs
      author: Julia Shirokova
      comment: create table dialog in the database
      changes:
        - createTable:
            tableName: dialogs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: conversation_partner1
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: conversation_partner2
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: modified_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
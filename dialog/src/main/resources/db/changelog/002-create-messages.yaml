databaseChangeLog:
  - changeSet:
      id: 002-create-messages
      author: Julia Shirokova
      comment: create table message in the database
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: dialog_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_messages_dialogs
                    references: dialogs(id)
                    nullable: false
              - column:
                  name: sent_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: message_text
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: receiver_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: read_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false